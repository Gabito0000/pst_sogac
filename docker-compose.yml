# Solicitalo — entorno de desarrollo en contenedores.
#
#   docker compose up -d --build      Levanta todo (sitio en http://localhost:8080)
#   docker compose run --rm node npm run dev   Arranca Vite con recarga en caliente
#   docker compose exec app php artisan test    Corre los tests
#
# El .env del host es el de XAMPP (DB_HOST=127.0.0.1). Aqui se sobrescribe con
# el bloque `environment:` de cada servicio, porque Laravel no pisa variables
# de entorno que ya existan en el sistema.

name: solicitalo

services:
  # ---------------------------------------------------------------- aplicacion
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: solicitalo/app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_NAME: "Solicítalo"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: "http://localhost:8080"

      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: solicitalo
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: database
      BROADCAST_CONNECTION: log
      FILESYSTEM_DISK: local
      LOG_CHANNEL: stack

      MAIL_MAILER: log
    volumes:
      - .:/var/www/html
      # Los assets del host se montan aparte para que el node contenga
      # sobreescriba public/build con lo que compile y no al reves.
      - vite_build:/var/www/html/public/build

  # ------------------------------------------------------------------- nginx
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - vite_build:/var/www/html/public/build:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  # --------------------------------------------------------------- postgres
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: solicitalo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # Solo en loopback: no se expone la base a la red local.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Al crear el volumen por primera vez, Postgres restaura este dump
      # (generado con pg_dump 18 desde tu base actual): el contenedor nace con
      # los 8 usuarios, sus roles, las solicitudes y la auditoria que tienes.
      # Si el volumen ya existe, el dump NO se vuelve a ejecutar.
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/10-datos-iniciales.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d solicitalo"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  # --------------------------------------------------------------------- node
  # Para trabajar con recarga en caliente:  docker compose run --rm node npm run dev
  node:
    image: node:22-bookworm-slim
    working_dir: /var/www/html
    depends_on:
      - app
    environment:
      APP_URL: "http://localhost:8080"
      VITE_APP_NAME: "Solicítalo"
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules
      - vite_build:/var/www/html/public/build
    ports:
      - "5173:5173"
    command: >
      sh -c "npm install && npm run dev -- --host 0.0.0.0"

  # -------------------------------------------------------------------- queue
  # La app usa QUEUE_CONNECTION=database, asi que los trabajos pendientes
  # necesitan un worker despachandolos.
  queue:
    image: solicitalo/app
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: solicitalo
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      QUEUE_CONNECTION: database
      CACHE_STORE: file
      SESSION_DRIVER: file
      LOG_CHANNEL: stack
    volumes:
      - .:/var/www/html
      - vite_build:/var/www/html/public/build
    entrypoint: ["/usr/local/bin/entrypoint"]
    command: ["php", "artisan", "queue:work", "--tries=3", "--verbose"]

volumes:
  postgres_data:
  vite_build:
  node_modules: