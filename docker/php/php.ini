; Ajustes de PHP para el contenedor de desarrollo.
; El host (XAMPP) tiene otros valores, pero en Linux el limite por defecto
; de upload (2M) hacia fallar los adjuntos del chat de soporte.

; --- Memoria y tiempo de ejecucion -------------------------------------------
memory_limit = 512M
max_execution_time = 120

; --- Carga de archivos ------------------------------------------------------
; El chat de soporte acepta imagenes de hasta 2 MB.
upload_max_filesize = 12M
post_max_size = 14M
max_file_uploads = 20

; --- Fecha y hora: la app trabaja con-America/Caracas ------------------------
date.timezone = America/Caracas

; --- OPcache ----------------------------------------------------------------
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1

; --- Errores: que se vean durante el desarrollo -----------------------------
display_errors = On
display_startup_errors = On
error_reporting = E_ALL

; --- Exponemos PHP-FPM por TCP en vez de socket Unix ------------------------
; Nginx corre en otro contenedor, asi que no puede alcanzar el socket local.
listen = 0.0.0.0:9000