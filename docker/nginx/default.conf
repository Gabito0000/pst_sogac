server {
    listen 80;
    server_name localhost;

    # El proyecto sirve desde public/, igual que en XAMPP.
    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 14M;

    # El frontend compilado por Vite y los estilos del panel.
    location /build/ {
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Los adjuntos del chat de soporte se sirven directo desde storage.
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        access_log off;
        try_files $uri =404;
    }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 120;
        include fastcgi_params;
    }

    # Con Vite en modo desarrollo el frontend se sirve desde el contenedor node.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # No se versiona ni se indexa nada dentro de storage.
    location ~ /storage/.*\.(php|phtml|php\d)$ {
        deny all;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        image/svg+xml;
}